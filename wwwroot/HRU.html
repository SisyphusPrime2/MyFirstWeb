
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>How Are You Today?</title>

    <style>
        :root {
            --bg-dark: #080b18;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --good: #4ade80;
            --normal: #facc15;
            --bad: #fb7185;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;

            color: var(--text-main);
            background:
                radial-gradient(
                    circle at 20% 20%,
                    #172554 0,
                    transparent 40%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    #3b0764 0,
                    transparent 40%
                ),
                var(--bg-dark);
        }

        /* Animated background glow */

        body::before {
            content: "";
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: #6366f1;
            filter: blur(150px);
            opacity: 0.15;
            animation: floatGlow 9s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            width: min(850px, 92%);
            padding: 3rem 2rem;
            text-align: center;

            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            backdrop-filter: blur(18px);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);

            animation: fadeIn 1s ease both;
        }

        .badge {
            display: inline-block;
            margin-bottom: 1.5rem;
            padding: 0.45rem 0.9rem;

            color: #c4b5fd;
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(167, 139, 250, 0.25);
            border-radius: 50px;

            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            line-height: 1.2;
            font-weight: 800;
            letter-spacing: -0.04em;
            margin-bottom: 1rem;

            background: linear-gradient(
                100deg,
                #ffffff,
                #c4b5fd,
                #93c5fd,
                #ffffff
            );
            background-size: 250% auto;
            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;

            animation: gradientMove 6s linear infinite;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 3rem;
        }

        /* Three evenly spaced answers */

        .answers {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1.25rem;
            width: 100%;
        }

        .answer {
            --accent: #ffffff;

            position: relative;
            isolation: isolate;
            overflow: hidden;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.9rem;

            min-height: 175px;
            padding: 1.5rem 0.75rem;

            border: 1px solid color-mix(
                in srgb, var(--accent) 30%, transparent
            );
            border-radius: 20px;

            background: rgba(255, 255, 255, 0.035);
            color: var(--text-main);

            font: inherit;
            cursor: pointer;

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        .answer::before {
            content: "";
            position: absolute;
            z-index: -1;
            inset: 0;

            background: radial-gradient(
                circle at 50% 100%,
                var(--accent),
                transparent 70%
            );

            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .answer:hover {
            transform: translateY(-10px) scale(1.025);
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--accent);

            box-shadow:
                0 12px 40px color-mix(
                    in srgb, var(--accent) 18%, transparent
                ),
                inset 0 0 20px rgba(255, 255, 255, 0.025);
        }

        .answer:hover::before {
            opacity: 0.12;
        }

        .answer:active {
            transform: translateY(-3px) scale(0.98);
        }

        .answer:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 5px;
        }

        .answer.good {
            --accent: var(--good);
        }

        .answer.normal {
            --accent: var(--normal);
        }

        .answer.bad {
            --accent: var(--bad);
        }

        .emoji {
            font-size: 3rem;
            line-height: 1;
            filter: drop-shadow(0 0 12px var(--accent));
            transition: transform 0.3s ease;
        }

        .answer:hover .emoji {
            transform: scale(1.2) rotate(-5deg);
        }

        .answer-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--accent);
        }

        .answer-description {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Feedback after choosing an answer */

        .feedback {
            min-height: 2rem;
            margin-top: 2rem;
            color: #c4b5fd;
            font-size: 1rem;
            font-weight: 500;
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.35s ease;
        }

        .feedback.show {
            opacity: 1;
            transform: translateY(0);
        }

        .footer {
            margin-top: 2.5rem;
            color: #64748b;
            font-size: 0.75rem;
            letter-spacing: 0.08em;
        }

        .dot {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #a78bfa;
            border-radius: 50%;
            opacity: 0.6;
            box-shadow: 0 0 12px #a78bfa;
            animation: twinkle 3s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes gradientMove {
            to {
                background-position: 250% center;
            }
        }

        @keyframes floatGlow {
            from {
                transform: translate(-80px, -50px);
            }
            to {
                transform: translate(100px, 80px);
            }
        }

        @keyframes twinkle {
            from {
                opacity: 0.15;
                transform: scale(0.7);
            }
            to {
                opacity: 0.9;
                transform: scale(1.4);
            }
        }

        @media (max-width: 600px) {
            body {
                overflow-y: auto;
                padding: 1.25rem 0;
            }

            .container {
                padding: 2.5rem 1.25rem;
            }

            .subtitle {
                margin-bottom: 2rem;
            }

            .answers {
                gap: 0.6rem;
            }

            .answer {
                min-height: 135px;
                padding: 1rem 0.35rem;
                border-radius: 15px;
                gap: 0.7rem;
            }

            .emoji {
                font-size: 2.2rem;
            }

            .answer-title {
                font-size: 0.95rem;
            }

            .answer-description {
                font-size: 0.68rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- Decorative background particles -->
    <div class="dot" style="top: 15%; left: 15%;"></div>
    <div class="dot" style="top: 28%; left: 82%; animation-delay: 1s;"></div>
    <div class="dot" style="top: 78%; left: 20%; animation-delay: 2s;"></div>
    <div class="dot" style="top: 83%; left: 76%; animation-delay: 0.5s;"></div>
    <div class="dot" style="top: 10%; left: 55%; animation-delay: 1.5s;"></div>

    <main class="container">

        <span class="badge">✦ Daily Check-in ✦</span>

        <h1>How are you doing today?</h1>

        <p class="subtitle">
            Take a moment for yourself. How are you really feeling?
        </p>

        <div class="answers">

            <button class="answer good"
                    onclick="chooseAnswer('Good')">
                <span class="emoji">😊</span>
                <span class="answer-title">Good</span>
                <span class="answer-description">Feeling great!</span>
            </button>

            <button class="answer normal"
                    onclick="chooseAnswer('Normal')">
                <span class="emoji">😐</span>
                <span class="answer-title">Normal</span>
                <span class="answer-description">Just an average day.</span>
            </button>

            <button class="answer bad"
                    onclick="chooseAnswer('Bad')">
                <span class="emoji">😔</span>
                <span class="answer-title">Bad</span>
                <span class="answer-description">Not my best day.</span>
            </button>

        </div>

        <p class="feedback" id="feedback" aria-live="polite"></p>

        <footer class="footer">
            YOUR FEELINGS MATTER · EVERY SINGLE DAY
        </footer>

    </main>

    <script>
function chooseAnswer(answer) {
    if (answer === "Good" ||
        answer === "Normal" ||
        answer === "Bad") {

        window.location.href = "/HRU/Surprise";
        return;
    }
}
    </script>

</body>
</html>
